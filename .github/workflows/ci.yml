on: [push, pull_request]
name: CI
permissions:
  contents: read
env:
  GOLANGCI_LINT_VERSION: v2.12

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.24.x, 1.25.x, 1.26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Test the root package and all listed submodules
        dir: [., x/marshal]
    runs-on: ${{ matrix.os }}
    # Don't fail the job if a submodule fails
    continue-on-error: ${{ matrix.dir != '.' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: |
          go test -v -race ./...
          # go vet ./...
          # go test -bench=.

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.dir }}
